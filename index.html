<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raizy Delight's</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <img src="logo.png" alt="" class="splash-logo">
    <div class="splash-words">
      <span class="w1">Raizy</span>
      <span class="w2">Delight's</span>
      <span class="w3">Raizy Delight's</span>
    </div>
  </div>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#top" aria-label="Raizy Delight's home">
      <img src="logo.png" alt="" class="brand-logo">
      <span class="brand-word">Raizy Delight's</span>
    </a>
    <button id="order-btn" type="button">Your order <span id="order-count">0</span></button>
  </div>
</header>

<section class="hero" id="top">
  <div class="hero-inner">
    <div class="hero-text">
      <h1>Raizy<br>Delight's</h1>
      <p>Parve &amp; dairy cakes and pastries.</p>
      <div class="hero-actions">
        <a class="btn-solid" href="#lists">Start your order</a>
      </div>
    </div>
    <div class="hero-art">
      <img src="logo.png" alt="Raizy Delight's logo" class="hero-logo">
    </div>
  </div>
</section>

<nav class="tabs" id="lists" aria-label="Lists">
  <button class="tab active" data-list="parve">Parve</button>
  <button class="tab" data-list="dairy">Dairy</button>
</nav>

<main>
  <section id="parve" class="list active" aria-label="Parve list">
    <h2>Parve List</h2>
    <div class="grid" id="grid-parve"></div>
  </section>
  <section id="dairy" class="list" aria-label="Dairy list">
    <h2>Dairy List</h2>
    <div class="grid" id="grid-dairy"></div>
  </section>
</main>

<footer>
  <img src="logo.png" alt="" class="footer-logo">
</footer>

<script src="app.js"></script>
</body>
</html>
